# Aegis v3.6.0 默认配置，schema=1，单一自适应模式。
# 开机从 sysfs 推导拓扑；capacity 缺失时估算，频表缺失时仅保留端点。
schema = 1

[daemon]
log_level = "info"
profile_path = "/data/adb/tempo/profile/device.toml"

[events]
# BPF 需求观察窗口为 250 ms；并非整个守护的轮询周期。
runtime_quantum_us = 250000
demand_step = 0.10
screen_path = ""
# frame_stride 保留于 schema，当前 gfxinfo FAS 不以它抽帧。
frame_stride = 2
quiet_decay_ms = 60

[control]
# 以下旧兼容字段仍解析、校验，但不参与当前分档控制：
# quiet_ratio/quiet_cap、floor_exit_ms/fg_fast_ms/floor_residence_ms、
# drop_ratio/drop_factor、touch_lift_level/touch_ramp_ms/touch_ramp_stages/touch_decay_ms、
# launch_lift_level、prime_lift_level/prime_load_cap、ceiling_headroom、
# reserve_ratio/step_hysteresis/parked_headroom，以及 control.role_cap。
quiet_ratio = 0.50
quiet_cap = 0.28
# 静默按瞬时最大簇需求进入/退出；进入还需满足 settle 和交互窗口结束。
floor_enter_ratio = 0.05
floor_exit_ratio = 0.12
floor_settle_ms = 60
floor_exit_ms = 60
fg_fast_ms = 100
floor_residence_ms = 0
drop_ratio = 0.08
drop_factor = 2.0
# 同一接触会话固定抬频目标；触摸事件刷新此窗口，松手结束。
touch_lift_ms = 150
touch_lift_level = 0.30
touch_ramp_ms = 60
touch_ramp_stages = 3
touch_decay_ms = 45
# 启动、前台切换和亮屏的启动窗口；不由单纯负载升高触发。
launch_lift_ms = 1000
launch_lift_level = 1.00
prime_lift_level = 0.45
prime_load_cap = 0.78
ceiling_headroom = 0.18
# UI 帧耗时超过预算加 slack 时提供短时救援。
frame_slack_ms = 3.0
frame_burst_ms = 150
frame_burst_level = 0.70
reserve_ratio = 1.05
step_hysteresis = 0.03
parked_headroom = 0.08

# 分档上限 6~10；按频表索引等距抽取，原始档位不足则使用现有档位。
tier_table_max = 8
# 负载升档确认时间、常规降档间隔、单次升档步数；启动可立即到目标。
up_confirm_ms = 120
down_step_ms = 45
max_up_step = 2
# 触摸相对会话开始时的档位加档，prime 不参与触摸加档。
touch_lift_tiers = 1
# 启动目标按档位比例计算；启动 cap 也分档受限，不保证放开至硬件最高。
launch_tier_ratio = 0.62
# prime 普通需求与 IME 场景的目标档位比例，不是独立硬件 cap。
prime_cap_ratio = 0.70
ime_cap_ratio = 0.45
# cap 基线按档位索引计算；稀疏静默频表和温控可能使其更低。
safety_ceiling_ratio = 0.35
lookahead_tiers = 3
# 守护启动后的 cpufreq 只读保护窗口；不表示关闭充电控制。
startup_guard_ms = 20000
pressure_hold_ms = 1000
demand_smooth_ms = 200

# 选配的每簇自愿省电上限；留空或比例 1 不主动限制，保留温控且不锁最高频。
# 键为实际簇首 CPU（如 cpu0/cpu3/cpu7），比例需 >0 且 <=1。
# 0.5 = 硬件最高频率的 50%，向下对齐 OPP；低于硬件最低频率时夹到最低频率。
[control.cluster_cap_ratio]

[scene]
# 场景地板为档位索引。阅读/视频连续至少 3 次有效超预算反馈才提高自适应地板；
# 健康反馈重置连续计数，场景改变重置自适应地板；不保证解码或显示零掉帧。
reading_floor_tier = 0
video_floor_tier = 0
default_floor_tier = 0
reading_packages = ["com.dragon.read", "com.tencent.weread", "com.qidian.QDReader", "com.ireader", "com.duokan.reader"]
video_packages = ["tv.danmaku.bili", "com.ss.android.ugc.aweme", "com.ss.android.ugc.aweme.lite", "com.phoenix.read", "com.qiyi.video", "com.tencent.qqlive", "com.youku.phone", "com.hunantv.imgo.activity", "com.google.android.youtube"]
ime_packages = ["com.sohu.inputmethod.sogou", "com.baidu.input", "com.iflytek.inputmethod", "com.google.android.inputmethod.latin", "com.miui.inputmethod", "com.tencent.wetype"]

# 旧兼容字段：当前分档控制不读取该组比例。
[control.role_cap]
efficiency = 1.00
balanced = 1.00
prime = 1.00

[charge]
stop_at_percent = 80
resume_at_percent = 70
temp_stop_c = 45.0
temp_resume_c = 40.0
# 兼容字段；实际仅由 stop_at_percent == 100 推导插电会话锁存。
latch_per_plug = false
# 100% 涓流阶段需连续小电流满 full_hold_seconds，或驱动上报 Full，才锁存。
full_current_ma = 100
full_hold_seconds = 9
# 可选电压门槛（mV），用于小电流判定；默认不启用。
# full_voltage_mv = 4300

[thermal]
# 基于电池温度的附加 CPU 档位限制，不关闭厂商 thermal。
guard_c = 45.0
# profile 保留于 schema，当前未实现按此名称选择温控曲线。
profile = "auto"

[ui]
language = "zh"

# 接管厂商 walt governor 的换档节奏：只写 walt/pl 与 walt/{up,down}_rate_limit_us，
# 不设置频率上限，也不改 scaling_min_freq / scaling_max_freq。
# 实测（设置页轻滑 10 秒 ftrace，Aegis 冻结、纯 governor 对比）：
#   厂商标配：中核换档 1872 次、命中 2707200 共 80 次、平均 1187~1208MHz；
#   关预测 + 20ms 升频节流 + 不限制降频：540 次、12 次、1051~1062MHz，
#   顶频驻留 9~10ms -> 0~1ms，Settings 滑动 0 掉帧，冷启动耗时不变。
# 降频不要加节流：那会把高频“挂”住，平均频率反而升高（实测 2ms/8ms 时更高）。
[governor]
smooth = true
prediction = false
up_rate_limit_us = 20000
down_rate_limit_us = 0
# 被厂商或其它模块改回默认时的补写周期；0 = 只在启动/重载时写一次。
reapply_ms = 60000

[fas]
# 总开关开启且前台包被选中才采样；空列表不代表所有应用。
enabled = false
apps = []
frame_budget_ms = 16.0
